name: Android APK (auto-build)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm64-release:
    name: Build arm64 release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 21 = locally verified toolchain (v0.4.1 built under Java 21); Java 17 fails Kotlin DSL script compilation
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # `pub get` rewrites the committed registrant WITH the dev-only
      # integration_test plugin, but the release classpath prunes that dev
      # dependency (Flutter PluginHandler) -> java compile fails on the
      # missing package. Restore the release-form registrant committed in git.
      - name: Restore release-form plugin registrant
        run: git checkout HEAD -- android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java

      # Documented single-ABI release chain — README.md ("Quirk when running
      # Gradle directly") + test-folder/logs/arm64-size-report-v041.md.
      # The three flags are mandatory: without them the APK ships all three
      # ABIs (192 MB instead of 96 MB) and skips icon tree-shaking.
      - name: assembleRelease (arm64-v8a, ABI filter forced, icons tree-shaken)
        run: cd android && ./gradlew assembleRelease -Ptownship.abiFilters=arm64-v8a -Pdisable-abi-filtering=true -Ptree-shake-icons=true

      - name: SHA-256 of the APK (job summary)
        id: sha256
        run: |
          set -euo pipefail
          shopt -s nullglob
          # android/build.gradle.kts redirects rootProject buildDirectory to
          # <repo>/build, so :app output lands in build/app/... (not android/app/...).
          # Glob both, mirroring the Upload APK artefact step below.
          apks=(build/app/outputs/apk/release/*.apk android/app/build/outputs/apk/release/*.apk)
          [ ${#apks[@]} -gt 0 ] || { echo "::error::no release apk found"; exit 1; }
          APK="${apks[0]}"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          # Resolved path consumed by the "Stage APK for release" step and by
          # the android-release job (via the app-release-apk artefact).
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          SUM="$(sha256sum "$APK")"
          SIZE="$(stat -c %s "$APK")"
          echo "$SUM"
          {
            echo "## Township of Tomorrow — release APK"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| file | \`$APK\` |"
            echo "| size (bytes) | $SIZE |"
            echo "| sha256 | \`${SUM%% *}\` |"
            echo ""
            echo "Single-ABI build: \`arm64-v8a\` only (\`-Pdisable-abi-filtering=true\`, \`-Ptree-shake-icons=true\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      # Normalise the resolved APK to a single predictable path so the release
      # job can consume it without re-running Gradle.
      - name: Stage APK for release
        id: stage
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "${{ steps.sha256.outputs.apk_path }}" dist/app-release.apk
          sha256sum dist/app-release.apk

      - name: Upload APK artefact
        uses: actions/upload-artifact@v4
        with:
          name: township-of-tomorrow-arm64-release
          path: |
            build/app/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Dedicated single-file artefact: the release job downloads ONLY this
      # (small, exact) instead of the whole multi-APK bundle.
      - name: Upload raw APK artefact for release
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: dist/app-release.apk
          if-no-files-found: error

  android-release:
    name: Publish GitHub Release (v* tags)
    needs: build-arm64-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: dist

      - name: Compute sha256 + size
        id: meta
        run: |
          set -euo pipefail
          ls -l dist
          SHA="$(sha256sum dist/app-release.apk | cut -d' ' -f1)"
          SIZE="$(stat -c %s dist/app-release.apk)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA size=$SIZE"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/app-release.apk
          name: Township of Tomorrow ${{ github.ref_name }}
          body: |
            Township of Tomorrow ${{ github.ref_name }} — arm64-v8a release APK.

            sha256: `${{ steps.meta.outputs.sha }}` · size: ${{ steps.meta.outputs.size }} bytes

            Install: download `app-release.apk` below, then `adb install -r app-release.apk`
            (or copy to an arm64 device and open it with "Install unknown apps" enabled).
          draft: false
          prerelease: false
          generate_release_notes: true
